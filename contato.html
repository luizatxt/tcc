<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato — Zupi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>


<header class="topbar">
  <div class="container">
    <a href="index.html" class="logo">Zupi</a>
    <nav>
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="planos.html">Planos</a>
      <a href="login.html" class="btn">Entrar</a>
    </nav>
  </div>
</header>


<main class="container page">
  <h1>Fale conosco</h1>
  <p>Tem alguma dúvida? Entre em contato conosco!</p>


  <form id="contactForm" class="contato-form">
    <label for="nome">Nome (responsável)</label>
    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>


    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="Seu e-mail" required>


    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Sua mensagem" required></textarea>


    <button class="btn primary" type="submit">Enviar</button>
  </form>
</main>


<footer class="footer">
  <div class="container">
    <p>© 2025 Zupi</p>
  </div>
</footer>


<script src="js/main.js"></script>
</body>
</html>
